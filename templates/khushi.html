
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jinja Templating Demo</title>
</head>
<body>

    <h1>Welcome to Flask!</h1>

    <h2>Hello, {{ name }}!</h2>

    <p>Course: {{ course }}</p>

    <h3>My Skills</h3>
    <ul>
        {% for skill in skills %}
            <li>{{ skill }}</li>
        {% endfor %}
    </ul>

    {% if skills %}
        <p>Skills loaded successfully!</p>
    {% else %}
        <p>No skills available.</p>
    {% endif %}

</body>
</html>
